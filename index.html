      --accent-orange: #ff5722;
      --border-color: #e5e7eb;

    * {

      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 40px;
    }

    /* 이미지 스타일 반영 헤더 */
    header {
      background-color: #fffaf5;
      text-align: center;
      padding: 45px 20px 40px;
      margin-bottom: 30px;
      border-bottom: 1px solid #f0e6df;
    }

    .header-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 800px;
      margin: 0 auto;
    }

    /* 상단 배지 */
    .header-top-badge {
      background-color: #ffede8;
      color: var(--accent-orange);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    /* 메인 타이틀 */
    .header-title {
      font-size: 2.3rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .header-title .highlight {
      color: var(--accent-orange);
    }

    /* 서브 타이틀 */
    .header-sub-text {
      font-size: 1.05rem;
      color: #475569;
      margin-bottom: 25px;
      font-weight: 700;
      background: #f1f5f9;
      padding: 6px 18px;
      border-radius: 20px;
      display: inline-block;
    }

    /* 검색 영역 탭 선택기 */
    .search-tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 25px;
    }

    .search-tab {
      border: none;
      background: transparent;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .search-tab.active {
      background-color: #1e293b;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* 멀티 검색창 바 */
    .multi-search-box {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border: 2px solid var(--accent-orange);
      border-radius: 30px;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(255, 87, 34, 0.12);
    }

    .multi-search-box form {
      display: flex;
      width: 100%;
      align-items: center;
    }

    .engine-select {
      border: none;
      outline: none;
      background: #f8fafc;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      border-right: 1px solid #e2e8f0;
    }

    .multi-search-input {
      border: none;
      outline: none;
      width: 100%;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
    }

    .multi-search-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .multi-search-btn {
      background: linear-gradient(135deg, #ff6b35, #ff3b00);
      border: none;
      color: white;
      width: 60px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      transition: opacity 0.2s ease;
    }

    .multi-search-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 카테고리 필터 버튼 */
    .category-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .category-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4b5563;
      transition: all 0.2s ease;
    }

    .category-btn:hover, .category-btn.active {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .link-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;

      color: #94a3b8;
      width: 30px;
      text-align: center;

    .link-card:nth-child(2) .rank-number { color: #f97316; }
    .link-card:nth-child(3) .rank-number { color: #eab308; }

      height: 40px;
      border-radius: 8px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin: 0 12px;
      flex-shrink: 0;

      overflow: hidden;

      font-size: 1rem;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    // 링크 카드 렌더링 함수
    function renderLinks(data) {
      linkGrid.innerHTML = data.map((item, index) => `
        <a href="${item.url}" class="link-card" target="_blank" rel="noopener noreferrer">
          <div class="rank-number">${index + 1}</div>
          <div class="link-icon">${item.icon}</div>
          <div class="link-info">
            <div class="link-title">${item.name} <span class="badge">${item.category}</span></div>
            <div class="link-desc">${item.desc}</div>
          </div>
        </a>
      `).join('');
    }

    // 카테고리 필터링 함수
    function filterCategory(category) {
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.trim() === category);
      });

      if (category === '전체') {
        renderLinks(links);
      } else {
        const filtered = links.filter(item => item.category === category);
        renderLinks(filtered);
      }
    }

    // 초기 실행 (전체 목록 출력)
    renderLinks(links);
